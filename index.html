
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Launcher</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #080d0a;
  color: #eaffef;
  font: 16px Arial, sans-serif;
}

main {
  width: min(440px, 92vw);
  padding: 30px;
  background: #111b14;
  border: 1px solid #31543a;
}

h1 { margin-top: 0; }

p { color: #a5bbaa; line-height: 1.5; }

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 15px;
}

input {
  color: white;
  background: #080d0a;
  border: 1px solid #31543a;
}

button {
  border: 0;
  background: #43e477;
  color: #07140a;
  font-weight: bold;
  cursor: pointer;
}

#status {
  margin-top: 12px;
  color: #a5bbaa;
  font-size: 13px;
}
</style>
</head>
<body>
<main>
  <h1>Web Launcher</h1>
  <p>Enter a website to open it in a new about:blank tab.</p>

  <form id="form">
    <input id="url" placeholder="example.com" required>
    <button type="submit">OPEN WEBSITE</button>
  </form>
  <div id="status"></div>
</main>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  let address = document.getElementById("url").value.trim();

  if (!/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(address)) {
    address = "https://" + address;
  }

  let destination;

  try {
    destination = new URL(address);
    if (!["http:", "https:"].includes(destination.protocol)) {
      throw new Error("Invalid protocol");
    }
  } catch {
    document.getElementById("status").textContent =
      "Enter a valid website address.";
    return;
  }

  // Open the blank tab directly during the button click.
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    document.getElementById("status").textContent =
      "Popup blocked. Allow popups and try again.";
    return;
  }

  // Keep the new tab at about:blank and render the requested site inside it.
  const doc = tab.document;
  doc.open();
  doc.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>
<style>
html,body,iframe {
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  border:0;
  overflow:hidden;
}
</style>
</head>
<body>
<iframe id="site" referrerpolicy="no-referrer"
 sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>
</body>
</html>`);
  doc.close();

  // Assign the URL as a property, not as HTML, to avoid injection.
  tab.document.getElementById("site").src = destination.href;

  document.getElementById("status").textContent =
    "Website opened. Redirecting this page to Google…";

  setTimeout(() => {
    window.location.replace("https://www.google.com/");
  }, 300);
});
</script>
</main>
</body>
</html>
