
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Launcher</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080d0a;
    color: #e8f5eb;
    font-family: Arial, sans-serif;
}

.launcher {
    width: min(440px, 92%);
    padding: 32px;
    background: #101a13;
    border: 1px solid #294a32;
    box-shadow: 0 0 35px #00ff6610;
}

h1 {
    margin-top: 0;
    font-size: 27px;
}

p {
    color: #9bb4a0;
    font-size: 14px;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 14px;
    margin: 14px 0;
    color: white;
    background: #080d0a;
    border: 1px solid #36563d;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #48e879;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    background: #35db69;
    color: #061109;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #65f18c;
}

#status {
    min-height: 20px;
    margin-top: 15px;
    font-size: 13px;
    color: #9bb4a0;
}
</style>
</head>
<body>

<main class="launcher">
    <h1>Web Launcher</h1>
    <p>
        Enter a website address. It will open in a separate
        tab, and this page will redirect to Google.
    </p>

    <form id="launchForm">
        <input
            id="urlInput"
            type="text"
            placeholder="example.com"
            autocomplete="url"
            required
        >
        <button type="submit">OPEN WEBSITE</button>
    </form>

    <div id="status" role="status"></div>
</main>

<script>
const form = document.getElementById("launchForm");
const input = document.getElementById("urlInput");
const status = document.getElementById("status");

form.addEventListener("submit", function (event) {
    event.preventDefault();

    let address = input.value.trim();

    if (!address) return;

    // Add HTTPS if the user didn't specify a protocol.
    if (!/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(address)) {
        address = "https://" + address;
    }

    let url;

    try {
        url = new URL(address);

        // Only allow regular web addresses.
        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Invalid protocol");
        }
    } catch {
        status.textContent = "Please enter a valid website address.";
        return;
    }

    // Open directly from the user click to reduce popup blocking.
    const newTab = window.open("about:blank", "_blank");

    if (!newTab) {
        status.textContent =
            "Popup blocked. Allow popups for this site and try again.";
        return;
    }

    // Navigate the new tab directly, without an iframe.
    try {
        newTab.location.href = url.href;
    } catch {
        status.textContent = "The website could not be opened.";
        return;
    }

    // Redirect the original page to Google.
    window.location.replace("https://www.google.com/");
});
</script>

</body>
</html>
